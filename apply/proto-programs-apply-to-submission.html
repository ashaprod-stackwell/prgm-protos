  --slate:#1D253F; --midnight:#0C1329;
  
  --mint:#18E4BF; --mint-200:#8EF8E6; --slate-600:#151C36;
  --amber:#F0B23C;

  --white:#FFFFFF;

*{ -webkit-font-smoothing:antialiased; box-sizing:border-box; margin:0; padding:0; }
body{ background:#E5E8EE; font-family:'General Sans',system-ui,sans-serif; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; }


.t-label-md-upper{ font-family:'General Sans',sans-serif; font-weight:500; font-size:13px; line-height:14px; letter-spacing:0.5px; text-transform:uppercase; }
.t-label-md{ font-family:'General Sans',sans-serif; font-weight:500; font-size:13px; line-height:normal; }
.t-label-lg{ font-family:'General Sans',sans-serif; font-weight:500; font-size:15px; line-height:16px; letter-spacing:0.1px; }
.t-headline-sm{ font-family:'Montserrat',sans-serif; font-weight:600; font-size:28px; line-height:1.3; letter-spacing:-0.28px; }
.t-title-md{ font-family:'Montserrat',sans-serif; font-weight:600; font-size:20px; line-height:1.2; letter-spacing:-0.2px; }
.t-body-sm{ font-family:'General Sans',sans-serif; font-weight:500; font-size:15px; line-height:1.5; }
.t-hero{ font-family:'Montserrat',sans-serif; font-weight:600; font-size:30px; line-height:1.35; letter-spacing:-0.6px; }
.t-prog-name{ font-family:'General Sans',sans-serif; font-weight:600; font-size:15px; line-height:1.2; }


.phone-outer{ width:418px; height:894px; border-radius:54px; padding:10px; flex-shrink:0;
  background:linear-gradient(160deg,#111 0%,#2a2a2a 50%,#0a0a0a 100%);
  box-shadow:0 40px 80px -28px rgba(29,37,63,0.55),0 2px 0 rgba(255,255,255,0.05) inset,0 0 0 1px rgba(255,255,255,0.04) inset; }
.phone-inner{ width:100%; height:100%; border-radius:44px; overflow:hidden; position:relative;
  background:linear-gradient(180deg,#1E2E55 0%,#182444 24%,#111A33 54%,#0C1329 100%); }

.sbar{ position:absolute; top:0; left:0; right:0; height:50px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; z-index:30; color:var(--white); pointer-events:none; }
.island{ position:absolute; top:11px; left:50%; transform:translateX(-50%); width:112px; height:32px; border-radius:20px; background:#000; z-index:32; pointer-events:none; }

.scroll{ position:absolute; inset:0; overflow-y:auto; padding-top:50px; padding-bottom:119px; scrollbar-width:none; }
.scroll::-webkit-scrollbar{ display:none; }


.header{ height:64px; display:flex; align-items:center; padding:0 18px; }
.brandrule{ width:1px; height:16px; background:rgba(255,255,255,0.28); margin:0 10px; }


.col{ padding:0 18px; display:flex; flex-direction:column; gap:16px; }


.progcard{ background:var(--midnight); border-radius:20px; overflow:hidden; }
.progcard-head{ background:var(--midnight); display:flex; align-items:center; gap:10px; padding:12px 8px 12px 18px; }
.progicon{ width:24px; height:24px; border-radius:4px; background:var(--tertiary-90); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-family:'Montserrat',sans-serif; font-weight:700; font-size:13px; line-height:14px; letter-spacing:0.5px; text-transform:uppercase; color:var(--tertiary-10); }
.progcard-body{ background:var(--slate); border-radius:20px; padding:18px 20px 24px; display:flex; align-items:center; justify-content:space-between; }


.photocard{ position:relative; height:314px; border-radius:20px; overflow:hidden; background:var(--slate);
  box-shadow:0 24px 52px -30px rgba(6,12,30,0.80), inset 0 1px 0 rgba(255,255,255,0.12); }
.pgrain{ position:absolute; inset:0; width:100%; height:100%; opacity:0.09;
  mix-blend-mode:overlay; pointer-events:none; z-index:2; }

.photocard img, .face img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

.photocard .copy, .face .copy{ text-shadow:0 1px 12px rgba(6,10,24,0.55); }
.photocard .scrim, .face .scrim{ position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(29,37,63,0.22) 0%, rgba(29,37,63,0.06) 20%, rgba(12,19,41,0.62) 40%, rgba(12,19,41,0.90) 62%, rgba(12,19,41,0.97) 100%); }

.photocard .copy, .face .copy{ position:absolute; left:0; right:0; bottom:25px; z-index:4; display:flex; flex-direction:column; align-items:center; text-align:center; }

.card-eye{ font-family:'General Sans',sans-serif; font-weight:600; font-size:10px;
  letter-spacing:0.2em; text-transform:uppercase; }

.face.back .copy{ position:static; }


.sphere{ position:absolute; border-radius:50%; filter:blur(58px); }
.sph-a{ width:270px; height:270px; top:-92px; left:50%; transform:translateX(-50%); opacity:0.55; }
.sph-b{ width:180px; height:180px; top:26px; left:-52px; opacity:0.30; }

.cta{ width:100%; height:52px; border-radius:9999px; display:flex; align-items:center; justify-content:center; gap:7px;
  font-family:'General Sans',sans-serif; font-size:15px; font-weight:600; }
.cta-mint{ background:var(--mint); color:var(--slate); }
.cta-white{ background:var(--white); color:var(--midnight); }


.hstrip{ display:flex; gap:10px; overflow-x:auto; margin:0 -18px; padding:0 18px 4px; scrollbar-width:none; }
.hstrip::-webkit-scrollbar{ display:none; }
.wcard{ flex:0 0 168px; height:134px; background:var(--slate); border-radius:16px; padding:14px; display:flex; flex-direction:column; }


.footer{ position:absolute; left:0; right:0; bottom:0; height:93px; padding-bottom:26px; display:flex; z-index:20;
  background:var(--midnight); border-top:1px solid rgba(83,97,139,0.30); }
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; padding-top:10px;
  font-family:'General Sans',sans-serif; font-size:13px; font-weight:500; color:var(--g500); }
.tab.active{ color:var(--white); font-weight:600; }

@keyframes livedot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}
.livedot{ animation:livedot 2s ease-in-out infinite; }
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.anim{ animation:fadeUp .32s ease-out both; }
@media (prefers-reduced-motion: reduce){ .livedot,.anim{ animation:none !important; } }


.chip{ padding:8px 15px; border-radius:9999px; font-size:13px; font-weight:600; background:#fff; color:var(--slate); border:1px solid var(--g100); }
.chip.on{ background:var(--midnight); color:#fff; border-color:transparent; }
.chip.on-amber{ background:var(--amber); color:#2C1E07; border-color:transparent; }
.chip.sm{ padding:6px 13px; font-size:12px; }
.notes{ max-width:620px; margin:26px auto 0; background:#fff; border:1px solid var(--g100); border-radius:16px; padding:18px 20px; }
.notes h4{ font-family:'General Sans',sans-serif; font-size:12px; font-weight:600; letter-spacing:1.4px; text-transform:uppercase; color:var(--g500); margin-bottom:10px; }
.notes li{ font-size:13px; line-height:1.55; color:var(--slate); margin-left:16px; margin-bottom:6px; }
.notes li b{ font-weight:600; }

.celebrate{ animation:bloom 1.6s ease-in-out .2s 2 both; }
@keyframes bloom{
  0%,100%{ box-shadow:0 0 0 1px rgba(24,228,191,0.40), 0 0 44px -18px rgba(24,228,191,0.55); }
  50%    { box-shadow:0 0 0 1px rgba(24,228,191,0.80), 0 0 76px -6px rgba(24,228,191,0.95); } }

.tfsheet{ position:absolute; inset:0; z-index:60; background:#F4F6FA; display:flex; flex-direction:column;
  animation:tfup .28s cubic-bezier(.2,.7,.3,1) both; }
@keyframes tfup{ from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:translateY(0)} }
.tfbar{ height:3px; background:rgba(12,19,41,0.10); flex-shrink:0; }
.tfbar i{ display:block; height:100%; width:16%; background:var(--mint); }
.tftop{ display:flex; align-items:center; gap:10px; padding:16px 18px 6px; flex-shrink:0; }
.tfx{ width:28px; height:28px; border-radius:50%; background:rgba(12,19,41,0.06); color:var(--g600);
  font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tftitle{ flex:1; font-family:'General Sans',sans-serif; font-size:13px; font-weight:600; color:var(--slate); }
.tfstep{ font-family:'General Sans',sans-serif; font-size:12px; font-weight:500; color:var(--g400); }
.tfbody{ flex:1; padding:18px 22px 8px; overflow-y:auto; scrollbar-width:none; }
.tfbody::-webkit-scrollbar{ display:none; }
.tfq{ font-family:'Montserrat',sans-serif; font-weight:600; font-size:21px; letter-spacing:-0.4px;
  color:var(--slate); line-height:1.25; }
.tfhint{ font-family:'General Sans',sans-serif; font-size:13px; color:var(--g500); margin-top:6px; }
.tfopt{ display:flex; align-items:center; gap:11px; padding:14px; border-radius:12px; background:#fff;
  border:1px solid #DDE0E8; margin-top:10px; font-family:'General Sans',sans-serif; font-size:14px;
  font-weight:500; color:var(--slate); line-height:1.3; }
.tfopt i{ width:22px; height:22px; border-radius:6px; border:1.5px solid #A2A7B9; flex-shrink:0;
  font-style:normal; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; color:var(--g500); }
.tffoot{ padding:12px 22px 24px; flex-shrink:0; }
.tfnote{ font-family:'General Sans',sans-serif; font-size:11px; color:var(--g400); text-align:center; margin-bottom:10px; }


.cardpill{ position:absolute; top:14px; right:14px; z-index:3; border-radius:9999px; padding:6px 12px;
  background:rgba(12,19,41,0.55); border:1px solid rgba(255,255,255,0.20);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  font-family:'General Sans',sans-serif; font-size:10px; font-weight:600; color:#fff;
  letter-spacing:0.14em; text-transform:uppercase; }
.cardmoney{ font-family:'Montserrat',sans-serif; font-weight:600; font-size:40px; line-height:1;
  letter-spacing:-2px; color:var(--mint); text-shadow:0 0 26px rgba(24,228,191,0.5); }
.seal{ width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;
  background:rgba(24,228,191,0.16); border:2px solid var(--mint); box-shadow:0 0 26px -4px rgba(24,228,191,0.70);
  animation:sealpop .6s cubic-bezier(.2,.8,.3,1) .15s both; }
@keyframes sealpop{ 0%{transform:scale(.4);opacity:0} 60%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
.shimmer{ position:absolute; inset:0; z-index:3; pointer-events:none; overflow:hidden; border-radius:20px; }
.shimmer::after{ content:''; position:absolute; top:-40%; bottom:-40%; width:55%; left:-70%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,0.28), transparent); transform:skewX(-18deg);
  animation:sweep 1.15s ease-out .45s 1 both; }
@keyframes sweep{ to{ left:125%; } }


.flipstage{ perspective:1500px; height:314px; }
.flipcard{ position:relative; width:100%; height:314px; transform-style:preserve-3d; cursor:pointer;
  transition:transform 1s cubic-bezier(.4,.04,.2,1); }
.flipcard.flipped{ transform:rotateY(180deg); }
.face{ position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden;
  border-radius:20px; overflow:hidden; transform:translateZ(0); }

.flipcard.flipped .face:not(.back),
.flipcard:not(.flipped) .face.back{ visibility:hidden; transition:visibility 0s linear .5s; }

.face.back{ transform:rotateY(180deg); display:flex; flex-direction:column; justify-content:center;
  padding:22px 20px; text-align:left;
  background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,0.055) 52%, transparent 64%),
             linear-gradient(145deg, #2E5C66 0%, #24455A 26%, #1A2740 60%, #141B2E 100%); }
.fliphint{ font-family:'General Sans',sans-serif; font-weight:500; font-size:13px; color:var(--g400);
  text-align:center; margin-top:10px; }


.flipcta{ display:flex; align-items:center; justify-content:center; gap:6px; width:100%; margin-top:18px;
  background:var(--mint); color:var(--midnight); border-radius:9999px; padding:15px;
  font-family:'General Sans',sans-serif; font-size:17px; font-weight:600; white-space:nowrap;
  box-shadow:0 0 14px rgba(105,249,222,0.45); }


.mtile{ position:relative; border-radius:20px; overflow:hidden; height:128px; cursor:pointer;
  display:flex; align-items:flex-end;
  background:radial-gradient(120% 130% at 82% 8%, #2BE0C4 0%, #1B6FA8 42%, #16204A 78%); }
.mtile-ring{ position:absolute; border:1.5px solid rgba(255,255,255,0.16); border-radius:50%; z-index:1; }

.mtile-ring.r2{ width:118px; height:118px; right:-12px; top:-30px; }
.mtile-copy{ position:relative; z-index:3; padding:18px 20px; }
.mtile-title{ font-family:'Montserrat',sans-serif; font-weight:600; font-size:19px; line-height:1.1;

.mtile-sub{ font-family:'General Sans',sans-serif; font-weight:500; font-size:12.5px; line-height:1.35;

    {s.pill && <div className="cardpill">{s.pill}</div>}
    <CardCopy s={s} onStart={onStart}/>
  </div>
);

const FlipCard = ({s}) => {
  const [flipped,setFlipped] = useState(false);
  useEffect(()=>{
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ setFlipped(true); return; }
    const t = setTimeout(()=>setFlipped(true), 5000);
    return ()=>clearTimeout(t);
  },[]);
  return (
    <div>
      <div className="flipstage">
        <div className={"flipcard"+(flipped?" flipped":"")} style={flipped?{cursor:"default"}:null}
             onClick={()=>{ if(!flipped) setFlipped(true); }}>
          <div className="face celebrate">
            <img src={s.photo} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",objectPosition:`center ${s.crop||'25%'}`}} onError={e=>{e.target.style.display='none';}}/>
            <div className="scrim"/><PhotoGrain/>
            <div className="shimmer"/>
            <CardCopy s={s}/>
          </div>
          <div className="face back">
            <div className="t-title-md" style={{color:"#fff"}}>{s.setupTitle}</div>
            <div className="t-body-tight" style={{color:"var(--g300)",marginTop:4}}>{s.setupSub}</div>
            <div style={{display:"flex",flexDirection:"column",gap:4,padding:"14px 0 2px"}}>
              {s.steps.map((st,i)=>(
                <div key={i} className="setuprow">
                  {i===0 && <div className="ln"/>}
                  <div className={"setupnode "+st.state}><span>{st.n}</span></div>
                  <div style={{flex:1,minWidth:0}}>
                    <div className={st.state==='on'?"t-body-lg-600":"t-body-lg"} style={{color:st.state==='on'?"#fff":"#BBBFCE"}}>{st.title}</div>
                    {st.sub && <div className="t-body-tight" style={{color:"var(--g400)",marginTop:1}}>{st.sub}</div>}
                  </div>
                </div>
              ))}
            </div>
            <button className="flipcta" onClick={e=>e.stopPropagation()}>{s.backCta}</button>
          </div>
        </div>
      </div>
      {flipped
        ? <button className="leavelink" style={{marginTop:16}}>{s.leave}</button>
        : <div className="fliphint">Tap the card to turn it</div>}
    </div>
  );
};

const ArtCard = ({s}) => {
  const sp = SPHERE[s.tone] || SPHERE.denied;
  return (
    <div className="photocard">
      <div className="sphere sph-a" style={{background:sp.a}}/>
      <div className="sphere sph-b" style={{background:sp.b}}/>
      <div className="scrim"/>
      <CardCopy s={s}/>
    </div>
  );
};

const TF_OPTIONS = [
  { k:'A', label:'Learn how investing actually works' },
  { k:'B', label:'Build savings for after graduation' },
  { k:'C', label:'Start investing without risking my own money' },
];

  <div className="tfsheet">
    <div className="tfbar"><i/></div>
    <div className="tftop">
      <button className="tfx" onClick={onClose} aria-label="Close">&#10005;</button>

      <span className="tfstep">1 of 6</span>
    </div>
    <div className="tfbody">

  { k:'TikTok',    p:<><path d="M14.1 4v9.3a3.6 3.6 0 1 1-3-3.55"/><path d="M14.1 4c.35 2.3 2 3.95 4.4 4.15"/></> },

  { k:'Snapchat',  p:<><path d="M12 3.4c2.5 0 4.2 1.9 4.2 4.3 0 .9-.1 1.6-.1 2.2.5.3 1.1.2 1.6 0 .5-.2.9.5.4.9-.5.4-1.3.6-1.5 1 .3 1.4 2 2.9 3.3 3.2.4.1.4.6 0 .8-.7.3-1.6.4-1.9.7-.1.3-.1.8-.4.9-.5.2-1.5-.2-2.6 0-.9.2-1.5 1.3-2.9 1.3s-2-1.1-2.9-1.3c-1.1-.2-2.1.2-2.6 0-.3-.1-.3-.6-.4-.9-.3-.3-1.2-.4-1.9-.7-.4-.2-.4-.7 0-.8 1.3-.3 3-1.8 3.3-3.2-.2-.4-1-.6-1.5-1-.5-.4-.1-1.1.4-.9.5.2 1.1.3 1.6 0 0-.6-.1-1.3-.1-2.2 0-2.4 1.7-4.3 4.2-4.3z"/></> },
];

const GlyphGrad = ({id}) => (
  <defs>
    <linearGradient id={id} x1="52" y1="8" x2="52" y2="96" gradientUnits="userSpaceOnUse">
      <stop stopColor="#6FF5E0"/><stop offset="0.52" stopColor="#2FD0C0"/><stop offset="1" stopColor="#17909B"/>
    </linearGradient>
  </defs>
);
const ClaimedGlyph = ({size=104}) => (
  <svg width={size} height={size} viewBox="0 0 104 104" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="claimg" x1="52" y1="12" x2="52" y2="92" gradientUnits="userSpaceOnUse">
        <stop stopColor="#6FF5E0"/><stop offset="0.52" stopColor="#2FD0C0"/><stop offset="1" stopColor="#17909B"/>
      </linearGradient>
      <linearGradient id="claimdisc" x1="52" y1="16" x2="52" y2="88" gradientUnits="userSpaceOnUse">
        <stop stopColor="#8FFCEA"/><stop offset="0.58" stopColor="#33D4C4"/><stop offset="1" stopColor="#1C9EA6"/>
      </linearGradient>
    </defs>
    <circle cx="52" cy="52" r="43" stroke="url(#claimg)" strokeWidth="1.5" opacity="0.26"/>
    <circle cx="52" cy="52" r="34" fill="url(#claimdisc)"/>
    <path d="M39.5 52.5 L48 61 L65 44" stroke="#12203C" strokeWidth="6.5"
          strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);
const PausedGlyph = ({size=104}) => (
  <svg width={size} height={size} viewBox="0 0 104 104" fill="none" aria-hidden="true">

    <rect x="27" y="13" width="50" height="8" rx="4" fill="url(#pauseg)"/>
    <rect x="27" y="83" width="50" height="8" rx="4" fill="url(#pauseg)"/>
    <path d="M34 23h36v6.5c0 6.4-3.1 12.4-8.3 16.1L54.5 51a3 3 0 0 0 0 4.9l7.2 5.4c5.2 3.7 8.3 9.7 8.3 16.1V81H34v-4.6c0-6.4 3.1-12.4 8.3-16.1l7.2-5.4a3 3 0 0 0 0-4.9l-7.2-5.4C37.1 41.9 34 35.9 34 29.5z" fill="url(#pauseg)"/>
    <path d="M41 74.5c0-4.6 4.9-8 11-8s11 3.4 11 8z" fill="#16204A" opacity="0.55"/>

);

const StateTile = ({glyph, eye, title, sub, children}) => (
  <div className="statetile">
    <Grain/>
    <div className="st-in">
      {glyph && <div className="statetile-glyph">{glyph}</div>}
      {eye && <div className="st-eye">{eye}</div>}
      <div className="statetile-t">{title}</div>
      <div className="statetile-s">{sub}</div>
      {children}
    </div>
  </div>
);

const SocChips = () => (
  <div className="soc-chips">
    {SOCIALS.map(s=>(
      <button key={s.k} className="soc-chip" title={s.k} aria-label={s.k}>
        <Svg size={19} strokeWidth={1.7}>{s.p}</Svg>
      </button>
    ))}
  </div>
);

const FollowAlong = () => (<>
  <div className="soc-rule"/>
  <div className="soc-lab">Follow along</div>
  <SocChips/>
</>);

const FollowCard = () => (
  <div className="soc-standalone">
    <div className="soc-lab">Follow along</div>
    <SocChips/>
  </div>
);

const OfferCard = ({claimed}) => claimed ? (
  <StateTile glyph={<ClaimedGlyph/>} eye="Claimed" title={OFFER.claimed} sub={OFFER.claimedSub}>
    <FollowAlong/>
  </StateTile>
) : (
  <div className="offer">
    <div className="offer-ring r1"/><div className="offer-ring r2"/>
    <div className="offer-in">
      <div className="offer-eye">{OFFER.eye}</div>
      <div className="offer-head">{OFFER.head}</div>
      <div className="offer-sub">{OFFER.sub}</div>
      <button className="offer-cta">{OFFER.cta}<Arrow size={16} strokeWidth={2.4} color="var(--midnight)"/></button>
      <div className="offer-fine">{OFFER.fine}</div>
    </div>
  </div>
);

const Grain = () => (
  <svg style={{position:"absolute",inset:0,width:"100%",height:"100%",opacity:0.10,
               mixBlendMode:"overlay",pointerEvents:"none",zIndex:3}} aria-hidden="true">
    <filter id="ocgrain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#ocgrain)"/>
  </svg>
);

const OfferHero = ({acct='new', compact}) => (
  <div className={"oc"+(compact?" compact":"")}>
    <Grain/><div className="oc-sheen"/>
    <div className="oc-in">
      <div className="oc-eye">{OFFER.eye}</div>
      <div className="oc-head">{OFFER.head}</div>
      <div className="oc-sub">{OFFER.sub}</div>
      {!compact && (
        <div className="oc-reasons">
          {OFFER.reasons.map((r,i)=>(
            <div key={i} className="oc-r">
              <span style={{flexShrink:0,marginTop:2,display:"flex"}}>
                <Check size={15} color="var(--mint)" strokeWidth={2.8}/></span>
              <div className="rt">{r}</div>
            </div>
          ))}
        </div>
      )}
      <Steps acct={acct}/>
      <button className="oc-cta">{PATH[acct].cta}<Arrow size={16} strokeWidth={2.4} color="#0B1226"/></button>
      <div className="oc-terms">
        <div className="oc-fine">{OFFER.fine}</div>
        <div className="oc-risk">{RISK}</div>
      </div>
    </div>
  </div>
);

const GrowthSlot = ({state, phase, acct}) => {
  const kind = S[state] && S[state].growth;
  if(!kind) return null;
  if(kind==='campaign') return <FollowCard/>;
  const ph = state==='closed' ? 'live' : phase;
  if(ph==='claimed') return (<>
    <Nudge n={TAB_NUDGE}/>
    <OfferCard claimed/>
  </>);
  return <OfferHero acct={acct} compact={S[state].compactOffer}/>;
};

const TAB_NUDGE = { title:'Your Programs tab is going away',
  body:'It disappears in three business days. Your account stays exactly as it is.' };

const Nudge = ({n}) => (
  <div className="nudge">
    <div className="nudge-inner">
      <div className="nudge-dec"><IcDoor size={24} color="var(--amber)" strokeWidth={1.8}/></div>
      <div style={{flex:1,minWidth:0}}>
        <div className="t-body-lg" style={{color:"#fff"}}>{n.title}</div>
        <div className="t-body-tight" style={{color:"var(--g400)"}}>{n.body}</div>
      </div>
    </div>
  </div>
);

const Footer = () => {
  const tabs=[{ic:IcHome,label:"Home"},{ic:IcBook,label:"Learning"},{ic:IcTrend,label:"My Stack"},{ic:IcTransfer,label:"Transfer"},{ic:IcComp,label:"Programs",active:true}];
  return (<div className="footer">{tabs.map((t,i)=>{const Ic=t.ic;return(
    <div key={i} className={"tab"+(t.active?" active":"")}>
      <Ic size={24} color={t.active?"var(--mint)":"var(--g500)"} strokeWidth={t.active?2:1.7}/>
      <span>{t.label}</span>
    </div>);})}</div>);
};

const SetupCard = ({s}) => (
  <div className="setupcard">
    <div className="t-title-md" style={{color:"#fff"}}>{s.setupTitle}</div>
    <div className="t-body-tight" style={{color:"var(--g200,#BBBFCE)",marginTop:6}}>{s.setupSub}</div>
    <div style={{display:"flex",flexDirection:"column",gap:6,padding:"16px 0 0"}}>
      {s.steps.map((st,i)=>(
        <div key={i} className="setuprow">
          {i===0 && <div className="ln"/>}
          <div className={"setupnode "+st.state}><span>{st.n}</span></div>
          <div style={{flex:1,minWidth:0}}>
            <div className={st.state==='on'?"t-body-lg-600":"t-body-lg"} style={{color:st.state==='on'?"#fff":"#BBBFCE"}}>{st.title}</div>
            {st.sub && <div className="t-body-tight" style={{color:"var(--g400)",marginTop:2}}>{st.sub}</div>}
          </div>
        </div>
      ))}
    </div>
    {s.backCta && <button className="flipcta">{s.backCta}</button>}
  </div>
);

const Screen = ({s,state,onStart,sheet,phase,visit,acct,onAck}) => {
  const firstOpen = state==='denied' && visit==='first';
  const claimedView = state!=='closed' && phase==='claimed' && s.growth==='offer';
  const g = firstOpen ? {...s, lede:null}
          : (state==='denied' && s.returning) ? {...s, ...s.returning, lede:null}
          : s;
  return (
  <div className="phone-inner">
    <StatusBar/>
    <div className="scroll">
      <Header brand/>
      <div className="col anim">
        <Greeting s={g}/>
        {(!s.takeover || s.program || firstOpen || claimedView) && <ProgramCard s={s}/>}
        {firstOpen ? (<>
          <StateTile title="You didn't get a spot"
            sub="More people applied than the program had room for. That is the whole reason.">
            <div className="st-facts">
              {FACTS.map(([t,sub])=>(
                <div key={t} className="frow">
                  <div className="ft">{t}</div>
                  <div className="fs">{sub}</div>
                </div>
              ))}
            </div>
          </StateTile>
          <button className="cta cta-ghost" onClick={onAck}>Got it</button>
        </>) : (<>
          {s.tile ? <StateTile glyph={<PausedGlyph/>} title={s.tileTitle} sub={s.tileSub}><FollowAlong/></StateTile>
            : s.flip ? <FlipCard s={s}/> : s.art ? <ArtCard s={s}/>
            : s.takeover ? null : <PhotoCard s={s} onStart={onStart}/>}
          {s.nudge && <Nudge n={s.nudge}/>}
          <GrowthSlot state={state} phase={phase} acct={acct}/>
          {s.leave && !s.flip && <button className="leavelink">{s.leave}</button>}
          {s.cta && (
            <button className={"cta "+(s.tone==='denied'||s.tone==='paused'?"cta-white":"cta-mint cta-glow")}>
              {s.cta}<Arrow size={17} strokeWidth={2.4} color={s.tone==='denied'||s.tone==='paused'?"var(--midnight)":"var(--slate)"}/>
            </button>
          )}
        </>)}
      </div>
    </div>
    <Footer/>
    {sheet}
  </div>
  );
};

const ORDER=[["survey","Get started"],["review","Under review"],["approved","Accepted"],
             ["denied","Not accepted"]];
const RETURNING=[["returning","Returning visits"],["claimed","Returning visits, claimed"]];


function App(){
  const [st,setSt]=useState("survey");
  const [form,setForm]=useState(false);
  const [paused,setPaused]=useState(false);
  const [visit,setVisit]=useState("first");
  const shown = (paused && st==='survey') ? 'paused' : st;
  const s = S[shown];
  const phase = visit==='claimed' ? 'claimed' : 'live';
  return (
    <div style={{minHeight:"100vh",padding:"28px 16px 60px",display:"flex",flexDirection:"column",alignItems:"center"}}>
      <div style={{textAlign:"center",maxWidth:620,padding:"0 16px",marginBottom:20}}>
        <div className="t-label-md-upper" style={{color:"var(--g500)",letterSpacing:"1.8px",fontSize:10}}>Program Tab &middot; Apply States</div>
        <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:600,fontSize:24,letterSpacing:"-0.5px",color:"var(--midnight)",marginTop:6}}>Apply through decision</div>
        <p className="t-body-sm" style={{color:"var(--g500)",fontSize:13,margin:"10px auto 0",maxWidth:520}}>
          One screen and one card that changes. Get started, under review, then accepted or not. Everyone takes the same survey; CSV applicants auto-accept on submit, on-app applicants go to admin review. Submissions paused is a program condition, so it is a toggle rather than a step. Copy and offer terms are drafts pending review.
        </p>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",marginBottom:12}}>
        {ORDER.map(([k,label])=>(
          <button key={k} onClick={()=>{setSt(k); if(k!=='survey') setPaused(false); if(k==='denied') setVisit('first');}}
            className={"chip"+(st===k&&!(paused&&st==='survey')?((k==='denied'||k==='closed')?" on-amber":" on"):"")}>{label}</button>
        ))}
      </div>
      {shown==='denied' && (
        <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center",alignItems:"center",marginBottom:12}}>
          {RETURNING.map(([k,label])=>(
            <button key={k} onClick={()=>setVisit(k)}
              className={"chip sm"+(visit===k?" on":"")}>{label}</button>
          ))}
        </div>
      )}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",marginBottom:12}}>
        <button onClick={()=>{setSt('closed'); setPaused(false);}}
          className={"chip"+(st==='closed'&&!(paused&&st==='survey')?" on-amber":"")}>Program closed</button>
        <button onClick={()=>{ setPaused(v=>!v); setSt('survey'); }}
          className={"chip"+(paused?" on-amber":"")}>Submissions paused</button>
      </div>
      <div style={{height:10}}/>
      <div className="phone-outer">
        <Screen key={shown+visit} s={s} state={shown} phase={phase}
          visit={visit} onAck={()=>setVisit('returning')}
          onStart={()=>setForm(true)}
          sheet={form ? <TypeformSheet onClose={()=>setForm(false)}
                          onSubmit={()=>{ setForm(false); setSt('review'); }}/> : null}/>
      </div>

    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
